# MacarenaLLM lab. Default profile: CPU (GPT-2), root on purpose (challenge 5).
#
#   docker compose up --build          -> http://<this-host>:7860 (all interfaces)
#   scripts/lab_up.sh                  -> same, but starts the GPU service when
#                                         a GPU the container can actually use is
#                                         detected (Linux + NVIDIA toolkit)
#
# The interface binds 0.0.0.0 on purpose (classroom/workshop use) so students
# can reach the lab from the local network. This is a DELIBERATELY VULNERABLE
# lab: only expose it on an isolated, trusted network (see OWASP LLM10 note
# in the README -- a network-reachable lab also shares its model and files).
# Loopback-only? Use:  ports: ["127.0.0.1:7860:7860"]
#
# Variants:
#   GPU (app-gpu service below): full CUDA wiring -- CUDA torch build + all
#     NVIDIA devices reserved. Needs a Linux host with an NVIDIA GPU and the
#     NVIDIA Container Toolkit. Apple Silicon CANNOT use it: macOS containers
#     run in a Linux VM with no GPU (no MPS/Metal passthrough exists); on a
#     Mac run natively instead (python main.py auto-detects MPS).
#   Hardened (commented in `app`): runs non-root, read-only root fs, no caps
#     -- challenge 5 then FAILS with "permission denied", which is the lesson.
services:
  app:
    build: .
    ports:
      - "0.0.0.0:7860:7860"          # all interfaces (workshop default)
    environment:
      # Override: deepseek | gpt2 | stub | any Hugging Face repo id
      - MACARENA_MODEL=
      # Bind the gradio server on all interfaces inside the container so the
      # published port above can reach it (the local default is 127.0.0.1).
      - MACARENA_SERVER_NAME=0.0.0.0
    volumes:
      - hf-cache:/cache/huggingface   # model downloads survive restarts
      - ./logs:/app/logs              # audit log readable from the host
    mem_limit: 2g                     # GPT-2 on CPU is fine with 2 GB
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # ---- Hardened variant (educational comparison) ----
    # user: "1000:1000"
    # read_only: true
    # tmpfs:
    #   - /tmp
    # cap_drop:
    #   - ALL

  # ---- GPU variant: `docker compose up --build app-gpu` (or scripts/lab_up.sh) ----
  # CUDA torch install (TORCH_INDEX_URL="" -> PyPI CUDA wheels) + every NVIDIA
  # GPU attached; the app then auto-detects CUDA and loads DeepSeek Coder 6.7B.
  app-gpu:
    build:
      context: .
      args:
        TORCH_INDEX_URL: ""           # empty -> no CPU index -> PyPI CUDA wheels
    profiles: ["gpu"]
    ports:
      - "0.0.0.0:7860:7860"
    environment:
      - MACARENA_MODEL=deepseek
      - MACARENA_SERVER_NAME=0.0.0.0
    volumes:
      - hf-cache:/cache/huggingface
      - ./logs:/app/logs
    mem_limit: 24g                    # DeepSeek Coder 6.7B needs the headroom
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf-cache:
